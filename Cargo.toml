[workspace]
members = [
    "crates/cli",
    "crates/crud",
    "crates/models",
    "crates/snapshot",
    "crates/validation",
]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
homepage = "https://github.com/HelloJowet/knowledge_base"
repository = "https://github.com/HelloJowet/knowledge_base"

[workspace.dependencies]
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
knowledge-base-crud = { version = "0.3.0", path = "crates/crud" }
knowledge-base-models = { version = "0.3.0", path = "crates/models" }
knowledge-base-snapshot = { version = "0.3.0", path = "crates/snapshot" }
knowledge-base-validation = { version = "0.3.0", path = "crates/validation" }
language-tags = "0.3"
pulldown-cmark = "0.13"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tempfile = "3"
url = "2.5"
yaml-edit = "0.2.3"
