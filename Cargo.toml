[workspace]
members = [
    "crates/cli",
    "crates/crud",
    "crates/models",
    "crates/validation",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
knowledge-base-crud = { path = "crates/crud" }
knowledge-base-models = { path = "crates/models" }
knowledge-base-validation = { path = "crates/validation" }
language-tags = "0.3"
pulldown-cmark = "0.13"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
url = "2.5"
